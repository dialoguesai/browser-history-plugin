<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dialogues Browser History</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 1rem;
            max-width: 480px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #ddd;
        }

        .tabs button {
            flex: 1;
            padding: 0.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }

        .tabs button.active {
            border-bottom-color: #2563eb;
            color: #2563eb;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .panel[hidden] {
            display: none !important;
        }

        label {
            display: block;
            margin-top: 0.75rem;
        }

        input,
        button,
        textarea {
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            height: 4em;
        }

        .hint {
            font-size: 0.85em;
            color: #555;
            margin-top: 0.25rem;
        }

        @media (prefers-color-scheme: dark) {
            .hint { color: #b8bdc7; }
        }

        .status-box {
            margin-top: 0.75rem;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .status-ok {
            background: #ecfdf5;
            color: #065f46;
        }

        .status-warn {
            background: #fffbeb;
            color: #92400e;
        }

        .status-err {
            background: #fef2f2;
            color: #991b1b;
        }

        .row-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .row-actions button.attach {
            width: 240px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
        }
    </style>
</head>

<body>
    <h1>Dialogues Browser History</h1>

    <section aria-label="Device name" style="margin-bottom:1.5rem;">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-top:0.75rem;">
            <label for="deviceName" style="margin:0;white-space:nowrap;">Device name</label>
            <input id="deviceName" type="text" maxlength="120" placeholder="e.g. Personal computer" style="flex:1;min-width:0;" />
        </div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Settings sections">
        <button type="button" class="active" data-tab="topos" role="tab" aria-selected="true">Topos</button>
        <button type="button" data-tab="supabase" role="tab" aria-selected="false">Supabase</button>
        <button type="button" data-tab="general" role="tab" aria-selected="false">General</button>
    </nav>

    <section id="panel-topos" class="panel active" data-panel="topos" role="tabpanel">
        <p class="hint">Connect once to write browsing data to <strong>your Topos</strong> via Dialogues Grant Access.</p>
        <div class="row-actions">
            <button type="button" id="attachDialogues" class="attach">
                <img src="https://cp.logu3s.com/static/brand/dialogues_logo_icon.png" alt="" width="16" height="16"
                    style="background:#fff;border-radius:4px;padding:2px;border:1px solid #d1d5db;" />
                Attach Dialogues
            </button>
            <button type="button" id="detachDialogues" class="attach" style="display:none;">
                <img src="https://cp.logu3s.com/static/brand/dialogues_logo_icon.png" alt="" width="16" height="16"
                    style="background:#fff;border-radius:4px;padding:2px;border:1px solid #d1d5db;" />
                Detach Dialogues
            </button>
            <span id="attachStatus"></span>
        </div>
        <p class="hint">Revoke access anytime in Topos → Sharing → Connected apps.</p>
    </section>

    <section id="panel-supabase" class="panel" data-panel="supabase" role="tabpanel" hidden>
        <label><input type="checkbox" id="supabaseActorColumns" /> Actor columns installed (apply tables/add_browser_actor.sql first)</label>
        <div id="supabaseSinkStatus" class="status-box status-err" style="display:none;"></div>
        <label>
            Supabase URL
            <input id="supabaseUrl" type="text" placeholder="https://xyz.supabase.co" />
        </label>
        <label>
            Supabase anon key
            <input id="anonKey" type="text" placeholder="public anon key" />
        </label>
        <p class="hint">Create tables: <code>tables/make_table_browserplugin.sql</code></p>
    </section>

    <section id="panel-general" class="panel" data-panel="general" role="tabpanel" hidden>
        <div id="redirectSetupStatus" class="status-box status-warn" style="display:none;"></div>
        <button type="button" id="retryRedirectSetup" style="display:none;margin-bottom:0.75rem;">Retry connection setup</button>
        <label style="display:flex;align-items:center;gap:0.5rem;">
            <input id="showStarButton" type="checkbox" style="width:auto;" />
            <span>Show on-page Star button</span>
        </label>
        <label>
            Skip domains (one per line)
            <textarea id="skipList" placeholder="e.g. airtable.com"></textarea>
        </label>
    </section>

    <button type="button" id="save" style="margin-top:1rem;">Save settings</button>
    <p id="status" style="color:green;visibility:hidden;">Saved!</p>

    <h2>Starred websites</h2>
    <div id="starredWebsites"></div>

    <script type="module" src="options.js"></script>
</body>

</html>
